<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src __CSP_SOURCE__ data:; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__';"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Slayer Stack Notification</title>
  <style nonce="__NONCE__">
    :root {
      --bg: var(--vscode-editor-background);
      --panel: var(--vscode-editorWidget-background, var(--vscode-sideBar-background));
      --border: var(--vscode-panel-border, var(--vscode-widget-border, rgba(127, 127, 127, 0.4)));
      --accent: var(--vscode-focusBorder);
      --highlight: var(--vscode-textLink-foreground);
      --text: var(--vscode-editor-foreground);
      --muted: var(--vscode-descriptionForeground);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--text);
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 16px;
    }

    .panel {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.45);
      transform: translateY(100px);
      opacity: 0;
      animation: slideIn 300ms ease-out forwards;
    }

    @keyframes slideIn {
      from {
        transform: translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      color: var(--highlight);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .workspace {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 12px;
    }

    .section-label {
      font-size: 11px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .tag {
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--panel);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
    }

    .prompt-list {
      margin: 0 0 14px 18px;
      padding: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      max-height: 90px;
      overflow: auto;
    }

    .prompt-list::-webkit-scrollbar {
      width: 6px;
    }

    .prompt-list::-webkit-scrollbar-thumb {
      background: var(--vscode-scrollbarSlider-background);
      border-radius: 999px;
    }

    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn {
      border-radius: 9px;
      border: 1px solid var(--vscode-button-border, transparent);
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--vscode-button-secondaryForeground);
      transition: transform 200ms ease, background 200ms ease, border-color 200ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
    }

    .btn-secondary {
      background: var(--vscode-button-secondaryBackground);
      color: var(--vscode-button-secondaryForeground);
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="panel">
      <div class="header">
        <div class="title-wrap">
          <div class="logo"><img src="__ICON_URI__" alt="Agent Slayer" /></div>
          <div class="title">Stack Detected</div>
        </div>
        <div class="badge">__STACK_COUNT__ found</div>
      </div>

      <div class="workspace">Workspace: __WORKSPACE_NAME__</div>

      <div class="section-label">Detected Stack</div>
      <div class="tags">__STACK_TAGS__</div>

      <div class="section-label">Recommended Prompts</div>
      <ul class="prompt-list">__PROMPT_LIST__</ul>

      <div class="actions">
        <button id="dismiss-btn" class="btn btn-secondary" type="button">Dismiss</button>
        <button id="activate-btn" class="btn btn-primary" type="button">Activate Recommended Prompts</button>
      </div>
    </section>
  </main>

  <script nonce="__NONCE__">
    const vscode = acquireVsCodeApi();

    document.getElementById('dismiss-btn').addEventListener('click', () => {
      vscode.postMessage({ command: 'dismiss' });
    });

    document.getElementById('activate-btn').addEventListener('click', () => {
      vscode.postMessage({ command: 'activateRecommended' });
    });

    window.setTimeout(() => {
      vscode.postMessage({ command: 'dismiss' });
    }, 8000);
  </script>
</body>
</html>
